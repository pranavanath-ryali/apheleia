[workspace]
resolver = "2"
members = [ "crates/*", "examples/*",  "tests/*" ]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
apheleia-core = { path = "crates/apheleia-core" }
apheleia-ui = { path = "crates/apheleia-ui" }
apheleia-macros = { path = "crates/apheleia-macros" }
apheleia-widgets = { path = "crates/apheleia-widgets" }
apheleia = { path = "crates/apheleia" }
