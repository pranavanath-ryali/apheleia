[workspace]
resolver = "2"
members = [ "crates/*", "examples/counter", "tests/*" ]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
apheleia-core = { path = "crates/apheleia-core" }
apheleia-types = { path = "crates/apheleia-types" }
apheleia-app = { path = "crates/apheleia-app" }
apheleia-ecs = { path = "crates/apheleia-ecs" }
apheleia-ecs-dep = { path = "crates/apheleia-ecs-dep" }
apheleia-widgets = { path = "crates/apheleia-widgets" }

smallvec = "1.15.1"
sparseset = "1.0.1"
crossterm = "0.29.0"
indexmap = "2.2.2"
tree-ds = "0.2.0"
rustc-hash = "2.1.2"
num-traits = "0.2.19"
bitvec = "1.1.1"

tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-appender = "0.2.5"
chrono = "0.4"
